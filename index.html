<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Git Lab Commands</title>
<style>
:root{
  --bg:#f6f5f1; --surface:#ffffff; --ink:#1d2320; --muted:#5f6b66; --line:#d9ddd6;
  --accent:#0f6b5c; --accent-ink:#ffffff; --flash:#d7efe6; --note:#8a5a00; --out:#eef3ef;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141a18; --surface:#1c2421; --ink:#e8efeb; --muted:#9aa8a1; --line:#2d3a35;
    --accent:#4fc7ad; --accent-ink:#0d1714; --flash:#1f4a3f; --note:#e3b45c; --out:#16201c;
  }
}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1c2421; --ink:#e8efeb; --muted:#9aa8a1; --line:#2d3a35;
  --accent:#4fc7ad; --accent-ink:#0d1714; --flash:#1f4a3f; --note:#e3b45c; --out:#16201c;
}
*{box-sizing:border-box}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{padding:20px 16px 8px;max-width:760px;margin:0 auto}
h1{font:700 1.5rem/1.2 Georgia,"Times New Roman",serif;margin:0 0 10px}
header p{margin:6px 0 0;color:var(--muted);font-size:.92rem}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;color:var(--ink);padding:7px 16px;font:600 .85rem system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px}
nav div{max-width:760px;margin:0 auto;display:flex;gap:8px;overflow-x:auto}
nav a{flex:none;padding:6px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface);font-size:.9rem}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
main{max-width:760px;margin:0 auto;padding:8px 16px 90px}
section{margin-top:26px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px;flex-wrap:wrap}
h2{font:700 1.1rem/1.3 Georgia,"Times New Roman",serif;margin:0}
h2 small{display:block;font:400 .85rem/1.4 system-ui,sans-serif;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:8px}
.btn{border:0;background:var(--accent);color:var(--accent-ink);padding:9px 14px;border-radius:8px;font:600 .85rem system-ui,sans-serif;cursor:pointer}
.btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
.list{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.note{padding:10px 14px 4px;font-size:.82rem;color:var(--note);font-weight:700;border-top:1px solid var(--line);text-transform:uppercase;letter-spacing:.04em}
.note:first-child{border-top:0}
.row{display:flex;align-items:stretch;border-top:1px solid var(--line);transition:background .15s}
.note+.row,.list>.row:first-child{border-top:0}
.row.done{background:var(--flash)}
.main{flex:1;min-width:0;text-align:left;border:0;background:transparent;color:var(--ink);padding:11px 6px 11px 14px;cursor:pointer;display:flex;gap:10px}
.n{flex:none;width:24px;height:24px;border-radius:50%;background:var(--out);color:var(--muted);font:700 .75rem/24px system-ui,sans-serif;text-align:center;margin-top:1px}
.txt{min-width:0;flex:1}
.txt code{display:block;font:.9rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;word-break:break-all}
.exp{display:block;font:.84rem/1.45 system-ui,sans-serif;color:var(--ink);opacity:.82;margin-top:4px}
.out{display:block;font:.78rem/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--muted);background:var(--out);border-radius:6px;padding:5px 8px;margin-top:6px;word-break:break-word}
.out b{font:700 .72rem system-ui,sans-serif;color:var(--accent);margin-right:6px}
.side{flex:none;width:64px;border:0;border-left:1px solid var(--line);background:transparent;color:var(--accent);font:700 .8rem system-ui,sans-serif;cursor:pointer}
.side:active{background:var(--flash)}
body.quick .exp,body.quick .out{display:none}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);
  padding:10px 18px;border-radius:999px;font:600 .88rem system-ui,sans-serif;opacity:0;pointer-events:none;transition:.2s}
#toast.show{opacity:1;transform:translateX(-50%)}
.dash{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-bottom:6px}.tile{display:block;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px}.tile:active{background:var(--flash)}.tile b{color:var(--accent);font:700 .72rem system-ui,sans-serif;text-transform:uppercase;letter-spacing:.04em}.tile strong{display:block;margin:4px 0;font-size:.95rem;line-height:1.3}.tile p{margin:0;font-size:.8rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.qq b{color:var(--accent)}.you{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin-top:16px}.you h2{font-size:1rem}.you .g{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.you label{display:block;font:600 .76rem system-ui,sans-serif;color:var(--muted);margin:6px 0 2px}.you input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit;font-size:.9rem}.you p{margin:8px 0 0;font-size:.78rem;color:var(--muted)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 12px}.tags span{font:.76rem/1.3 system-ui,sans-serif;padding:3px 10px;border-radius:999px;background:var(--out);color:var(--muted);border:1px solid var(--line)}.tags b{color:var(--accent)}.qq{margin:6px 0 0;font-size:.92rem}.qcard{margin-top:22px;padding-top:6px;border-top:2px solid var(--line)}.qcard h3{font:700 1rem/1.3 Georgia,serif;margin:12px 0 0}.cblock{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:10px;overflow:hidden}.chead{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);font:600 .82rem system-ui,sans-serif}.chead i{font-style:normal;font-weight:400;color:var(--muted);margin-left:8px}.cblock pre{margin:0;padding:10px 12px;overflow-x:auto;font:.82rem/1.45 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;cursor:pointer}.sub2{margin:14px 0 0;font:700 .8rem system-ui,sans-serif;color:var(--note);text-transform:uppercase;letter-spacing:.04em}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <h1>Git Lab Commands</h1>
  <div class="seg" role="group" aria-label="View mode">
    <button type="button" id="mQ" aria-pressed="false">Quick</button>
    <button type="button" id="mE" aria-pressed="true">With explanations</button>
  </div>
  <p>Tap any command to copy it. Use the side button too, or “Copy all” for the whole experiment.</p>
  <p>Replace names, emails and the GitHub username with your own before running.</p>
</header>
<nav><div id="tabs"></div></nav>
<main id="app"></main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* "command | explanation | output you will see"; "# " lines are step groups */
var EXPS = [
 {id:"e1", title:"Experiment 1", sub:"Setting up and basic commands", items:[
  "# Part 1: Create the folders",
  "mkdir deptofcsd | Creates a new folder called deptofcsd. This is the main folder for your lab work. | No output. The folder is created silently.",
  "cd deptofcsd | Moves you inside that folder so the next commands run there. | Prompt shows ~/deptofcsd",
  "mkdir 4AL25CSD000 | Creates a sub-folder named after your USN. This will be your project folder. | No output.",
  "cd 4AL25CSD000 | Enters the project folder. | Prompt shows ~/deptofcsd/4AL25CSD000",
  "echo $HOME | Prints your home directory so you know where Git Bash is working. | /c/Users/gcpus",
  "# Part 2: Initialize Git and set your identity",
  "git init | Turns this plain folder into a Git repository by creating a hidden .git folder that will store all history. | Initialized empty Git repository in .../.git/ and the prompt now shows (master)",
  'git config --global user.name "Pushpalatha" | Tells Git who you are. Every commit is stamped with this name. --global means it applies to all repositories on this computer. | No output.',
  'git config --global user.email "pushpalatha@aiet.org.in" | Sets the email stamped on every commit. | No output.',
  "git config user.name | Prints the saved name to confirm it was set. | Pushpalatha",
  "git config user.email | Prints the saved email to confirm it was set. | pushpalatha@aiet.org.in",
  "git config --list | Prints every Git setting. user.name and user.email appear near the bottom. | A long list of settings",
  "# Part 3: Create a file and check status",
  "echo My name is Pushpalatha > aboutme.txt | Creates aboutme.txt with this text. One > creates or overwrites the file, two >> adds to the end. | No output.",
  "dir | Lists the files in the folder to confirm the file exists. | aboutme.txt",
  "cat aboutme.txt | Displays what is inside the file. | My name is Pushpalatha",
  "git status | Asks Git what is happening. The new file is untracked because Git is not watching it yet. | Untracked files: aboutme.txt (red)",
  "# Part 4: Stage and commit",
  "git add aboutme.txt | Moves the file to the staging area, which means it is selected for the next commit. | No output. A “LF will be replaced by CRLF” warning is normal on Windows.",
  "git status | Checks again. The file is now staged, ready to commit. | Changes to be committed: new file: aboutme.txt (green)",
  'git commit -m "Added aboutme.txt file" | Saves a permanent snapshot of the staged files. -m gives the commit message. | [master (root-commit) a763fa2] Added aboutme.txt file, 1 file changed',
  "git status | Confirms nothing is left to save. | nothing to commit, working tree clean",
  "# Part 5: View history",
  "git log | Shows the commit history with ID, author, date and message. | commit a763fa2... Author: pushpalatha... Added aboutme.txt file",
  "git log --oneline | Shows the same history in one short line per commit. | a763fa2 Added aboutme.txt file",
  "# Extra: Second file",
  "echo My name is Pushpalatha > MyFirstFile.txt | Creates another file to practice the same flow. | No output.",
  "git add MyFirstFile.txt | Stages the second file. | No output.",
  "git ls-files | Lists every file Git is tracking. | MyFirstFile.txt and aboutMe.txt",
  'git commit -m "Added first file" | Commits the second file. | [master 1ad7166] Added first file'
 ]},
 {id:"e2", title:"Experiment 2", sub:"Create a branch, switch to master, merge", items:[
  "# Part 1: Create a branch",
  "git branch | Lists all branches. The * marks the one you are on. | * master",
  "git branch feature-branch | Creates a new branch. It is a separate line of work that starts from the current commit. | No output.",
  "git branch | Confirms both branches exist. | feature-branch and * master",
  "# Part 2: Switch and make a change",
  "git checkout feature-branch | Switches your working folder to feature-branch. | Switched to branch 'feature-branch'",
  "git switch feature-branch | The newer command that does the same thing. Use either one. | Switched to branch 'feature-branch'",
  "echo This content is added in feature-branch >> myfirstfile.txt | Adds a new line to the end of the file. This change exists only on feature-branch. | No output.",
  "cat myfirstfile.txt | Shows the file with the new line. | My name is... and This content is added in feature-branch",
  "git add myfirstfile.txt | Stages the change. | No output.",
  'git commit -m "Updated myfirstfile.txt in feature-branch" | Saves the change on feature-branch. | [feature-branch 05d4261] Updated myfirstfile.txt..., 1 insertion(+)',
  "# Part 3: Go back to master and merge",
  "git switch master | Returns to master. The file goes back to how it was before your change. | Switched to branch 'master'",
  "git checkout master | Older command for the same thing. | Switched to branch 'master'",
  "git branch | Confirms you are on master. | feature-branch and * master",
  "git merge feature-branch | Brings the feature-branch commit into master. Fast-forward means master simply moves ahead to that commit. | Updating 4a0eb19..05d4261, Fast-forward, 1 file changed",
  "cat myfirstfile.txt | The new line is now visible on master. | Both lines are shown",
  "# Part 4: Clean up",
  "git branch -d feature-branch | Deletes the branch. It is safe because its work is already merged. | Deleted branch feature-branch (was 05d4261).",
  "git branch | Confirms only master is left. | * master"
 ]},
 {id:"e3", title:"Experiment 3", sub:"Stash changes, switch branch, apply stash", items:[
  "# Part 1: Make an uncommitted change",
  "git branch | Shows which branch you are on. | * master",
  "echo This line is added before stash >> myfirstfile.txt | Adds a line that you have not committed. | No output.",
  "cat myfirstfile.txt | Shows the file with the new line. | Your lines, including the new one",
  "git status | Shows the file as modified but not committed. | Changes not staged for commit: modified: myfirstfile.txt",
  "# Part 2: Stash the changes",
  "git stash -u | Puts your uncommitted work on a shelf and cleans the folder. -u also shelves untracked files. | Saved working directory and index state WIP on master: <commit id> <commit message>",
  "git stash list | Shows everything on the shelf. | stash@{0}: WIP on master: <commit id> <commit message>",
  "# Part 3: Switch branch and apply",
  "git branch feature-branch | Creates a second branch. | No output.",
  "git switch feature-branch | Moves to it. Your folder is clean, so switching is easy. | Switched to branch 'feature-branch'",
  "git checkout feature-branch | Older command for the same thing. | Switched to branch 'feature-branch'",
  "git stash apply | Brings the shelved changes back into this branch. The stash is kept on the shelf. | On branch feature-branch, Changes not staged for commit: modified: ...",
  "cat myfirstfile.txt | Verifies the stashed line is back. | The line you added before the stash",
  "git status | Shows the file modified again. | Changes not staged for commit",
  "# Part 4: Remove the stash",
  "git stash drop | Deletes the top stash entry now that it has been applied. | Dropped refs/stash@{0} (...)",
  "git stash pop | Optional: applies and deletes the stash in one step. | Same as apply, then drops it",
  "git stash clear | WARNING: deletes all stashes and the work saved in them. Optional. | No output."
 ]},
 {id:"e4", title:"Experiment 4", sub:"Clone a remote repository", items:[
  "# Part 1: Choose where to store it",
  "mkdir GitProjects | Creates a folder to hold your cloned projects. | No output.",
  "cd GitProjects | Moves into it. | Prompt shows ~/GitProjects",
  "# Part 2: Clone",
  "git clone https://github.com/octocat/Hello-World.git | Downloads a full copy of the remote repository, including all history. Git creates a Hello-World folder automatically. | Cloning into 'Hello-World'... Receiving objects: 100% done.",
  "cd Hello-World | Enters the cloned repository. | Prompt shows (master)",
  "# Part 3: Verify",
  "git status | Checks the state of the clone. | On branch master, Your branch is up to date with 'origin/master'. nothing to commit",
  "git remote -v | Shows which remote this repository is connected to. origin is the default name. | origin ...Hello-World.git (fetch) and (push)",
  "ls | Lists the downloaded files. | README"
 ]},
 {id:"e5", title:"Experiment 5", sub:"Fetch changes and rebase (Developer A and B)", items:[
  "# Part 1: Set up two developers",
  "mkdir DevA DevB | Creates two folders, one for each developer. | No output.",
  "cd DevA | You now act as Developer A. | Prompt shows ~/DevA",
  "git clone https://github.com/pushpalatha-prog/StudentManagement.git | Developer A downloads the repository. | Cloning into 'StudentManagement'...",
  "cd .. | Goes back up one level. | Prompt shows ~",
  "cd DevB | You now act as Developer B. | Prompt shows ~/DevB",
  "git clone https://github.com/pushpalatha-prog/StudentManagement.git | Developer B downloads the same repository. Now both have the same files. | Cloning into 'StudentManagement'...",
  "# Part 2: Developer A creates a file and pushes",
  "cd ~/DevA/StudentManagement | Opens Developer A's copy. | Prompt shows (main)",
  "git status | Checks A is up to date. | Your branch is up to date with 'origin/main'.",
  "echo a=10 > Addition.py | Starts Addition.py with the first line. | No output.",
  "echo b=20 >> Addition.py | Adds the second line. | No output.",
  'echo "print(a+b)" >> Addition.py | Adds the third line. | No output.',
  "cat Addition.py | Shows the file. | a=10, b=20, print(a+b)",
  "git add Addition.py | Stages the file. | No output.",
  'git commit -m "Added Addition program" | Saves A\u2019s snapshot locally. | [main 358c579] Added Addition Program',
  "git push origin main | Uploads A\u2019s commit to GitHub. | 878ff4c..358c579 main -> main",
  "# Part 3: Developer B works without A\u2019s changes",
  "cd ~/DevB/StudentManagement | Opens Developer B\u2019s copy, which does not have A\u2019s commit yet. | Prompt shows (main)",
  "echo a=20 > Subtraction.py | Starts Subtraction.py. | No output.",
  "echo b=10 >> Subtraction.py | Adds the second line. | No output.",
  'echo "print(a-b)" >> Subtraction.py | Adds the third line. | No output.',
  "cat Subtraction.py | Shows the file. | a=20, b=10, print(a-b)",
  "git add Subtraction.py | Stages the file. | No output.",
  'git commit -m "Added Subtraction program" | Commits locally on B\u2019s machine. | [main 3981239] Added Subtraction Program',
  "git push origin main | Tries to upload. GitHub rejects it because it already has A\u2019s commit that B does not have. | ! [rejected] ... remote contains work that you do not have locally",
  "# Part 4: Fetch, rebase, push",
  "git fetch origin | Downloads A\u2019s commit into B\u2019s repository but does not change B\u2019s files yet. | 878ff4c..358c579 main -> origin/main",
  "git rebase origin/main | Lifts B\u2019s commit off, brings in A\u2019s commit, then replays B\u2019s commit on top. History becomes one straight line. | Successfully rebased and updated refs/heads/main.",
  "git push origin main | Now the push is accepted because B\u2019s history contains A\u2019s. | 358c579..d59fbbd main -> main",
  "git log --oneline | Shows the final order: Initial, Addition (A), Subtraction (B). | Three or four commits in a straight line"
 ]}
];

var toastEl = document.getElementById("toast"), toastTimer;
function toast(m){ toastEl.textContent = m; toastEl.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function(){ toastEl.classList.remove("show"); }, 1400); }
function copyText(text, ok){
  function fb(){
    var t = document.createElement("textarea"); t.value = text; t.setAttribute("readonly",""); t.style.cssText = "position:fixed;opacity:0";
    document.body.appendChild(t); t.select(); var d = false;
    try{ d = document.execCommand("copy"); }catch(e){}
    document.body.removeChild(t); ok(d);
  }
  try{
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(text).then(function(){ ok(true); }, fb); } else { fb(); }
  }catch(e){ fb(); }
}
function parse(i){ var p = i.split(" | "); return {c:p[0], e:p[1]||"", o:p.slice(2).join(" | ")}; }
function cmdsOf(ex){ return ex.items.filter(function(i){ return i.charAt(0) !== "#"; }).map(function(i){ return parse(i).c; }); }
function promptFor(ex){
  return "I have a Git lab exam tomorrow (Project Management with Git). Teach me " + ex.title + ": " + ex.sub +
   ". Explain each command step by step in simple words, say what output I should see, then write an exam-ready answer (aim, steps, commands with sample output, result) and 5 viva questions with answers. I use Git Bash on Windows.\n\nCommands:\n" + cmdsOf(ex).join("\n");
}
var tabs = document.getElementById("tabs"), app = document.getElementById("app");
EXPS.forEach(function(ex){
  var a = document.createElement("a"); a.href = "#" + ex.id; a.textContent = ex.title; tabs.appendChild(a);
  var sec = document.createElement("section"); sec.id = ex.id;
  var head = document.createElement("div"); head.className = "head";
  var h2 = document.createElement("h2"); h2.textContent = ex.title;
  var sm = document.createElement("small"); sm.textContent = ex.sub; h2.appendChild(sm);
  var acts = document.createElement("div"); acts.className = "acts";
  var all = document.createElement("button"); all.className = "btn"; all.type = "button"; all.textContent = "Copy all";
  all.addEventListener("click", function(){ copyText(cmdsOf(ex).join("\n"), function(ok){ toast(ok ? ex.title + ": all commands copied" : "Copy failed, long-press to select"); }); });
  var ai = document.createElement("button"); ai.className = "btn alt"; ai.type = "button"; ai.textContent = "AI prompt";
  ai.addEventListener("click", function(){ copyText(promptFor(ex), function(ok){ toast(ok ? "AI prompt copied" : "Copy failed"); }); });
  acts.appendChild(all); acts.appendChild(ai); head.appendChild(h2); head.appendChild(acts); sec.appendChild(head);
  var list = document.createElement("div"); list.className = "list"; var step = 0;
  ex.items.forEach(function(i){
    if(i.charAt(0) === "#"){ var n = document.createElement("div"); n.className = "note"; n.textContent = i.slice(2); list.appendChild(n); return; }
    var p = parse(i); step++;
    var row = document.createElement("div"); row.className = "row";
    var main = document.createElement("button"); main.type = "button"; main.className = "main";
    var num = document.createElement("span"); num.className = "n"; num.textContent = step;
    var txt = document.createElement("span"); txt.className = "txt";
    var code = document.createElement("code"); code.textContent = p.c; txt.appendChild(code);
    if(p.e){ var e = document.createElement("span"); e.className = "exp"; e.textContent = p.e; txt.appendChild(e); }
    if(p.o){ var o = document.createElement("span"); o.className = "out"; var bb = document.createElement("b"); bb.textContent = "YOU SEE"; o.appendChild(bb); o.appendChild(document.createTextNode(p.o)); txt.appendChild(o); }
    main.appendChild(num); main.appendChild(txt);
    var side = document.createElement("button"); side.type = "button"; side.className = "side"; side.textContent = "Copy"; side.setAttribute("aria-label", "Copy " + p.c);
    function doCopy(){ copyText(p.c, function(ok){ if(ok){ row.classList.add("done"); setTimeout(function(){ row.classList.remove("done"); }, 1000); toast("Copied"); } else { toast("Copy failed, long-press to select"); } }); }
    main.addEventListener("click", doCopy); side.addEventListener("click", doCopy);
    row.appendChild(main); row.appendChild(side); list.appendChild(row);
  });
  sec.appendChild(list); app.appendChild(sec);
});
var mQ = document.getElementById("mQ"), mE = document.getElementById("mE");
function setMode(q){ document.body.classList.toggle("quick", q); mQ.setAttribute("aria-pressed", q); mE.setAttribute("aria-pressed", !q); }
mQ.addEventListener("click", function(){ setMode(true); }); mE.addEventListener("click", function(){ setMode(false); });
</script>
<script>
(function(){
var LANG="py",CM={py:"#",java:"//"};
function cap(b){return b.charAt(0).toUpperCase()+b.slice(1)}
function fn(b){return LANG==="py"?b+".py":cap(b)+".java"}
function jv(b,body){return "import java.util.Scanner;\npublic class "+cap(b)+" {\n    public static void main(String[] a) {\n        Scanner s = new Scanner(System.in);\n"+body+"\n    }\n}"}
function vn(f){return f.toLowerCase().replace(/ /g,"_")}
function form(b,t,fs){
 if(LANG==="py")return fs.map(function(f){return vn(f)+' = input("'+f+': ")'}).join("\n")+'\nprint("'+t+':", '+fs.map(vn).join(", ")+")";
 return jv(b,fs.map(function(f){return '        System.out.print("'+f+': ");\n        String '+vn(f)+' = s.nextLine();'}).join("\n")+'\n        System.out.println("'+t+': " + '+fs.map(vn).join(' + ", " + ')+");");
}
function login(b,t){
 if(LANG==="py")return 'print("== '+t+' Login ==")\nuser = input("Username: ")\npwd = input("Password: ")\nprint("Login successful" if user == "admin" and pwd == "1234" else "Invalid login")';
 return jv(b,'        System.out.println("== '+t+' Login ==");\n        System.out.print("Username: ");\n        String u = s.nextLine();\n        System.out.print("Password: ");\n        String p = s.nextLine();\n        System.out.println(u.equals("admin") && p.equals("1234") ? "Login successful" : "Invalid login");');
}
function marks(b){
 if(LANG==="py")return 'subjects = ["Maths", "Physics", "Python"]\nmarks = [int(input(x + " marks: ")) for x in subjects]\nprint("Average:", sum(marks) / len(marks))';
 return jv(b,'        String[] sub = {"Maths", "Physics", "Java"};\n        int total = 0;\n        for (String x : sub) {\n            System.out.print(x + " marks: ");\n            total += s.nextInt();\n        }\n        System.out.println("Average: " + total / 3.0);');
}
function wages(b){
 if(LANG==="py")return 'weekly = float(input("Weekly wage: "))\nprint("Monthly salary:", weekly * 4)';
 return jv(b,'        System.out.print("Weekly wage: ");\n        double w = s.nextDouble();\n        System.out.println("Monthly salary: " + w * 4);');
}
function avail(b){
 if(LANG==="py")return 'seats = {"101": 20, "102": 0}\nno = input("Train number: ")\nn = seats.get(no, 0)\nprint("Seats available:", n if n > 0 else "none")';
 return jv(b,'        System.out.print("Train number: ");\n        int no = s.nextInt();\n        int n = (no == 101) ? 20 : 0;\n        System.out.println(n > 0 ? "Seats available: " + n : "No seats available");');
}
function calc(b,op,w){
 if(LANG==="py")return 'a = int(input("First number: "))\nb = int(input("Second number: "))\nprint("'+w+':", a '+op+' b)';
 return jv(b,'        System.out.print("First number: ");\n        int x = s.nextInt();\n        System.out.print("Second number: ");\n        int y = s.nextInt();\n        System.out.println("'+w+': " + (x '+op+' y));');
}
